<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Wicked Wax for candle-making questions, orders and support.">
    <title>Contact - Wicked Wax</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="contact.css">
    <link rel="icon" href="../Assets/logo.jpeg" type="image/jpeg">

</head>

<body>

    <!-- ===== HEADER / NAV ===== -->
    <header>
        <a href="../index.html" id="brand-link">
            <img src="../Assets/logo.jpeg" alt="Wicked Wax Logo">
            <h1>Wicked Wax</h1>
        </a>

        <div class="left-header">
            <a href="../products/products.html" id="nav-shop-btn" class="nav-link">Shop</a>
            <a href="../build/build.html" id="nav-build-btn" class="nav-link">Build a Candle</a>
            <button aria-label="Cart">
                <img src="../Assets/cart.svg" alt="Cart Icon">
            </button>
        </div>

        <div class="right-header">
            <a href="../about/about.html" id="nav-about-btn" class="nav-link">About</a>
            <a href="contact.html" id="nav-contact-btn" class="nav-link nav-active">Contact</a>
        </div>
    </header>

    <main class="contact-page">
        <section class="contact-hero" aria-labelledby="contact-title">
            <p class="contact-kicker">Contact Us</p>
            <h2 id="contact-title">Feeling in the dark? Light up our inbox!</h2>
        </section>

        <section class="contact-panel" aria-label="Contact form">
            <form id="contact-form" novalidate>
                <div class="form-field">
                    <label for="contact-name">Name <span aria-hidden="true">*</span></label>
                    <input type="text" id="contact-name" name="name" autocomplete="name" required>
                    <p class="field-error" id="name-error"></p>
                </div>

                <div class="form-field">
                    <label for="contact-email">Email Address <span aria-hidden="true">*</span></label>
                    <input type="email" id="contact-email" name="email" autocomplete="email" required>
                    <p class="field-error" id="email-error"></p>
                </div>

                <div class="form-field">
                    <label for="contact-subject">Subject</label>
                    <input type="text" id="contact-subject" name="subject" autocomplete="off">
                    <p class="field-error" id="subject-error"></p>
                </div>

                <div class="form-field">
                    <label for="contact-message">Message <span aria-hidden="true">*</span></label>
                    <textarea id="contact-message" name="message" rows="6" required minlength="10"></textarea>
                    <p class="field-error" id="message-error"></p>
                </div>

                <button type="submit" class="contact-submit">Send Message</button>
            </form>

        </section>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer>
        <div id="soc-med">
            <a href="https://www.instagram.com/taylorswift/" target="_blank" rel="noopener">Instagram</a>
            <a href="https://x.com/taylorswift13" target="_blank" rel="noopener">X</a>
        </div>
        <a href="https://www.thehersheycompany.com/en_us/home/privacy-policy.html" target="_blank" rel="noopener" id="terms-link">Terms &amp; Privacy</a>
        <h5>&copy; 2026 Wicked Wax. All Rights Reserved.</h5>
    </footer>

    <script src="contact.js"></script>

</body>

</html>
